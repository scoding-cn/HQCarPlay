plugins {
    id 'com.android.library'
}
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 24
        consumerProguardFiles 'ambient-consumer-rules.pro'
        targetSdk = 37

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-24'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    ndkVersion = '28.2.13676358'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    buildFeatures {
        // Geely/Lynk head-unit input API (com.geely.inputservice); declarations in src/main/aidl.
        aidl true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
dependencies {
    implementation libs.androidx.app
    implementation libs.bouncycastle
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}

// 在 Gradle 配置 ndk-build 之前，先拉取固定 commit 的 lwIP 源码，
// 这样本地 Android Studio 构建也能自动补齐，不只在 CI 生效
def prepareLwipSources = tasks.register('prepareLwipSources', Exec) {
    workingDir rootProject.projectDir
    commandLine (System.getProperty('os.name').toLowerCase().contains('windows') ? ['py', '-3', 'scripts/prepare-lwip.py'] : ['python3', 'scripts/prepare-lwip.py'])
}
tasks.configureEach { task ->
    if (task.name.startsWith('generateJsonModel') || task.name.startsWith('externalNativeBuild')) {
        task.dependsOn(prepareLwipSources)
    }
}
